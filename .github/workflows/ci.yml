name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aichat
        uses: actions/checkout@v4
        with:
          path: aichat
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: aichat/go.mod
          cache-dependency-path: aichat/go.sum
      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/mibk/dupl@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # QQ-SDK 按 tag 取（go.mod require v0.1.0），不再检出它的仓库。
      # 本地开发用 go.work 接 sibling 目录，那个文件不入库，所以这里跑到的
      # 就是 tag 里的 SDK——与线上二进制同源。
      - name: Run four gates
        working-directory: aichat
        env:
          CGO_ENABLED: "1"
        run: bash scripts/check.sh
