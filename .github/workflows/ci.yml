name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build (linux/amd64)
        run: go build -trimpath -ldflags "-s -w" -o aichat ./cmd/aichat
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
