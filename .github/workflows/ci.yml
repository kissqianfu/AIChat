name: ci

# 质量门分两层（2026-11-02 调整）：
#
#   CI（本文件）：通用语义检查——编译、go vet、竞态测试、两个目标的交叉编译。
#     这些都是 Go 生态的标准命令，写死在 yml 里不会漂移，也不需要任何参数调优。
#
#   本地 scripts/check.sh（不入库）：项目策略——dupl 重复度、gosec 与
#     govulncheck、覆盖率门槛（platform/render/schedule 各 90%）。这些数字
#     随容忍度调整，属于"人看一眼再决定"的东西，留在本地更合适；塞进 CI
#     会导致改一次阈值就要动 workflow。
#
# 必须清楚的一点：CI 绿只代表"能编译、能过测试"，不代表能上线。
# 重复度、安全扫描、覆盖率这三项要靠 push 前手动跑一次 bash scripts/check.sh。
#
# 注意：push 与 pull_request 暂不触发（2026-11-02 摘掉），要在 Actions 页面点
# "Run workflow" 手动跑。要恢复自动触发，把 push / pull_request 加回 on: 段。
on:
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 依赖按 go.mod 的 tag 拉（QQ-SDK v0.1.0），不需要检出 sibling 目录；
      # go.work 本来就不入库，checkout 里也不会存在，所以这里天然走 tag。
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 两个交叉编译都必须 CGO_ENABLED=0：CGO=1 时用的是宿主 gcc，
      # 编不属于它的目标会挂在 runtime/cgo（grp.h: No such file）。
      # 这也是之前 gates 常红的原因之一。
      - name: Cross-compile linux/amd64
        env:
          CGO_ENABLED: "0"
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: Cross-compile windows/amd64
        env:
          CGO_ENABLED: "0"
        run: GOOS=windows GOARCH=amd64 go build ./...

      # -race 需要 cgo，而 ubuntu runner 自带 gcc，这里放开即可。
      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
