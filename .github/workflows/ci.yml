name: ci

# 流水线分三段（2026-11-02 重建）：
#
#   build-check  通用语义检查：编译 / go vet / 两个目标交叉编译 / 竞态测试。
#                全是 Go 生态标准命令，写死在 yml 里不会漂移。
#   build        交叉编译 linux/amd64，注入提交号，产出 artifact。
#   deploy       SSH 直连服务器：先 `cat >` 把二进制送过去，再把
#                .github/deploy-remote.sh 当剧本用 `sudo -n bash -s` 执行
#                （备份 → 安装 → 重启 → 自检 30s → 失败装回旧二进制）。
#                服务器上不安装任何脚本，仓库 HEAD 就是部署逻辑的唯一真相。
#
# 需要的仓库 secret 只有四个：SSH_HOST / SSH_PORT / SSH_USER / SSH_PRIVATE_KEY。
# 主机公钥不存 secret，写死在下面的 Prepare SSH 步骤里做比对（公钥不是秘密，
# 写死才能挡住中间人）。
#
# 质量门分两层，这里要说清：dupl 重复度、gosec/govulncheck、覆盖率门槛
# 留在本地 scripts/check.sh（不入库）。因此 CI 绿只代表"能编译、能过测试"，
# 那三项需要 push 前自己跑一次。
#
# 部署开关是仓库变量 DEPLOY_ENABLED：不配=照常部署，配成 false 即停自动部署。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # 依赖按 go.mod 的 tag 拉（QQ-SDK v0.1.0），不需要检出 sibling 目录；
      # go.work 本来就不入库，checkout 里也不会存在，所以这里天然走 tag。
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 两个交叉编译都必须 CGO_ENABLED=0：CGO=1 时用的是宿主 gcc，
      # 编不属于它的目标会挂在 runtime/cgo（grp.h: No such file）。
      - name: Cross-compile linux/amd64
        env:
          CGO_ENABLED: "0"
        run: GOOS=linux GOARCH=amd64 go build ./...

      - name: Cross-compile windows/amd64
        env:
          CGO_ENABLED: "0"
        run: GOOS=windows GOARCH=amd64 go build ./...

      # -race 需要 cgo，而 ubuntu runner 自带 gcc，这里放开即可。
      #
      # 失败时把关键行转成 annotation：job 日志接口要仓库 admin 权限，
      # 而 annotation 是匿名可读的，排查时不用先登录。
      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: |
          set +e
          go test -race -count=1 ./... > /tmp/test.log 2>&1
          rc=$?
          tail -80 /tmp/test.log
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|--- FAIL|=== RUN)|WARNING: DATA RACE|^panic:' /tmp/test.log \
              | head -10 | while IFS= read -r line; do
                echo "::error::$line"
              done
          fi
          exit "$rc"

  build:
    needs: build-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build linux/amd64 with version
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_SHA::7}"
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o aichat-linux ./cmd/aichat
          ls -lh aichat-linux
          sha256sum aichat-linux | tee aichat-linux.sha256
          # 记下这次构建用的两个仓库版本，排查"线上和本地不一致"时先看它
          {
            echo "aichat ${GITHUB_SHA}"
            echo "qqsdk  $(GOWORK=off go list -m -f '{{.Version}}' github.com/kissqianfu/QQ-SDK)"
            echo "built  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee build-info.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aichat-linux
          path: |
            aichat-linux
            aichat-linux.sha256
            build-info.txt
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # 仓库变量，不是 secret：不配照常部署，配成 false 即停自动部署。
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 连推两次不能让两个部署交叉安装。
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      # 要读 .github/deploy-remote.sh，所以这里必须检出。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: aichat-linux

      # 深夜不部署：webhook 模式下进程重启那几秒的事件没有重投机制，
      # 23:00-07:00 正是有人闲聊的时候。手动触发（workflow_dispatch）不受限。
      - name: Check deploy window
        id: window
        run: |
          h=$(TZ=Asia/Shanghai date +%H)
          if [ "$h" -ge 7 ] && [ "$h" -lt 23 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "当前 ${h} 点（北京时间），在部署窗口内"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当前 ${h} 点（北京时间），夜间不自动部署；需要的话手动 Run workflow"
          fi

      # 私钥只落到 runner 的临时文件，job 结束 runner 即销毁。
      - name: Prepare SSH
        if: steps.window.outputs.ok == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -eu
          missing=""
          for n in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY; do
            eval "v=\${$n:-}"
            [ -n "$v" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 secret:$missing（Settings → Secrets and variables → Actions）"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SSH_PRIVATE_KEY 解析失败：要贴 BEGIN/END 之间的全文"; exit 1; }

          # 主机公钥固定在这里。换机器或重装系统后这里会硬失败——把新公钥
          # （ssh-keyscan -p <port> -t ed25519 <host>）抄进这一行即可。
          expected=AAAAC3NzaC1lZDI1NTE5AAAAIGnghEWLJUrTfWDYLHdVvTgm3XNZN2ll7X/To7VH2pXb
          got=$(ssh-keyscan -T 10 -p "$SSH_PORT" -t ed25519 "$SSH_HOST" 2>/dev/null \
                | awk '$2=="ssh-ed25519"{print $3}' | head -1 || true)
          if [ "$got" != "$expected" ]; then
            echo "::error::主机密钥不匹配：期望 ${expected:0:20}… 实际 ${got:0:20}…"
            echo "可能是中间人，也可能机器换过；确认无误后更新 ci.yml 里的 expected。"
            exit 1
          fi
          printf '[%s]:%s ssh-ed25519 %s\n' "$SSH_HOST" "$SSH_PORT" "$got" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "私钥可解析，主机密钥校验通过"

      # 二进制走 stdin 落到 /tmp/aichat.incoming，不依赖 scp/sftp。
      - name: Upload binary
        if: steps.window.outputs.ok == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -T \
            "$SSH_USER@$SSH_HOST" 'cat > /tmp/aichat.incoming' < aichat-linux
          echo "已上传 $(stat -c %s aichat-linux) 字节"

      # 剧本从 stdin 送进去执行，服务器上不留文件。
      - name: Install and verify
        if: steps.window.outputs.ok == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -T \
            "$SSH_USER@$SSH_HOST" 'sudo -n bash -s' < .github/deploy-remote.sh
