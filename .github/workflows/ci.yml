name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aichat
        uses: actions/checkout@v4
        with:
          path: aichat
      - name: Checkout QQ-SDK
        uses: actions/checkout@v4
        with:
          repository: kissqianfu/QQ-SDK
          path: QQ-SDK
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: aichat/go.mod
          cache-dependency-path: |
            aichat/go.sum
            QQ-SDK/go.sum
      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/mibk/dupl@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run four gates
        working-directory: aichat
        env:
          QQSDK_DIR: ${{ github.workspace }}/QQ-SDK
          CGO_ENABLED: "1"
        run: bash scripts/check.sh

  # 构建产物：单文件 linux/amd64 二进制。版本号从提交 SHA 注入，
  # 启动日志会打「版本已加载 version=<sha>」，回滚时先看这一行。
  build:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aichat
        uses: actions/checkout@v4
        with:
          path: aichat
      - name: Checkout QQ-SDK
        uses: actions/checkout@v4
        with:
          repository: kissqianfu/QQ-SDK
          path: QQ-SDK
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: aichat/go.mod
          cache-dependency-path: |
            aichat/go.sum
            QQ-SDK/go.sum
      # go.mod 里是 replace github.com/kissqianfu/QQ-SDK => ../QQ-SDK，
      # 两个仓库必须检出到同级目录，否则直接编译失败。
      - name: Build linux/amd64
        working-directory: aichat
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_SHA::7}"
          GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o ../aichat-linux ./cmd/aichat
          ls -lh ../aichat-linux
          {
            echo "aichat ${GITHUB_SHA}"
            echo "qqsdk  $(git -C ../QQ-SDK rev-parse HEAD)"
            echo "built  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../build-info.txt
          cat ../build-info.txt
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aichat-linux
          path: |
            aichat-linux
            build-info.txt
          retention-days: 30

  # 部署开关：仓库 Settings → Variables 里建 DEPLOY_ENABLED=true 才启用。
  # 想临时停自动部署，把变量删掉或改成 false 即可，不用改这个文件。
  #
  # 服务器侧：/opt/aichat/deploy.sh 负责备份/安装/重启/自检/失败回滚；
  # 部署密钥在 authorized_keys 里被 command 锁死，只能触发这个脚本。
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: aichat-linux
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      # 二进制走 stdin，不走 scp：那把密钥被 command 锁死，只允许执行
      # deploy.sh，scp/sftp 在这种配置下本来就不可用。
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          timeout 180s ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy < aichat-linux
