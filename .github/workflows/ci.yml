name: ci

# 自动触发已暂时摘掉（2026-11-02）。
#
# 原因有两层：
#   1. 四道闸的入口 scripts/check.sh 没进仓库（.gitignore 里有一条 /scripts/），
#      gates 第一步就是 `bash scripts/check.sh`，找不到文件，从接入起 20 次全红；
#   2. 闸里的工具全部 @latest 安装，结果随上游漂移——本地版本绿，云端最新版
#      的 gosec 报 10 条 TLS/HTTP 调用链告警。
# 也就是说这条流水线现在既不反映真实质量，也没法区分成败，留着只会每次 push
# 都飘一条红的通知。
#
# 想恢复：把 scripts/check.sh 入库（去掉 .gitignore 的 /scripts/），并把四个闸
# 工具的版本钉死，再把下面的 push / pull_request 加回来。
# 在那之前要手动跑一次，去 Actions 页面点 "Run workflow" 即可。
on:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aichat
        uses: actions/checkout@v4
        with:
          path: aichat
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: aichat/go.mod
          cache-dependency-path: aichat/go.sum
      - name: Install gate tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install github.com/mibk/dupl@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # QQ-SDK 按 tag 取（go.mod require v0.1.0），不再检出它的仓库。
      # 本地开发用 go.work 接 sibling 目录，那个文件不入库，所以这里跑到的
      # 就是 tag 里的 SDK——与线上二进制同源。
      - name: Run four gates
        working-directory: aichat
        env:
          CGO_ENABLED: "1"
        run: bash scripts/check.sh
