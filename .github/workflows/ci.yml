name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build (linux/amd64)
        run: go build -trimpath -ldflags "-s -w" -o aichat ./cmd/aichat
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: aichat
          target: /tmp/aichat-deploy/



      - name: Backup, replace, restart, health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e                                     # 任一步失败即中止
            TS=$(date +%m%d-%H%M)
            sudo cp /opt/aichat/aichat /opt/aichat/aichat.bak-$TS   # 备份旧版
            sudo mv /tmp/aichat-deploy/aichat /opt/aichat/aichat # 原子替换
            sudo chown bot:bot /opt/aichat/aichat  
            sudo chmod 0755 /opt/aichat/aichat
            rm -rf /tmp/aichat-deploy
            sudo systemctl restart aichat
            sleep 3
            echo "deployed ok, backup: aichat.bak-$TS"